
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rimu & Pankaj | Save the Date</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #eee0ce;
      background-image:
        radial-gradient(ellipse at top, #fff8ee, transparent 70%);
    }

    .page {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .invitation {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d7bd99;
      box-shadow: 0 15px 40px rgba(65, 42, 25, .18);
    }

    .footer {
      margin: 20px 0;
      color: #76513d;
      font-family: Georgia, serif;
      font-size: 12px;
      letter-spacing: 3px;
    }
  </style>
</head>

<body>
  <main class="page">
    <img
      class="invitation"
      src="invitation.png"
      alt="Save the date: Rimu and Pankaj, 10 March 2027, Durgapur, West Bengal"
    >

    <p class="footer">RIMU & PANKAJ · 10 MARCH 2027</p>
  </main>
</body>
</html>
